<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Bloqueia o zoom indesejado no celular e ajusta à tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OdontoSantos - Consultório</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/pt-br.global.min.js"></script>
    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* Ajustes do Calendário para Mobile */
        @media (max-width: 768px) {
            .fc .fc-toolbar { flex-direction: column; gap: 0.5rem; align-items: stretch !important; }
            .fc .fc-toolbar-title { font-size: 1rem !important; text-align: center; }
            .fc-header-toolbar { margin-bottom: 0.75rem !important; }
            .fc-button { padding: 0.5rem !important; font-size: 0.8rem !important; font-weight: 600 !important; }
            .fc-toolbar-chunk { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
            .fc-timegrid-axis-cushion, .fc-timegrid-slot-label-cushion { font-size: 0.75rem !important; }
            /* Esconde cabeçalho da tabela no mobile para virar card */
            .tabela-responsiva thead { display: none; }
        }
        /* Touch Targets Maiores */
        button, select, input { min-height: 44px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-100">
            <div class="text-center mb-6 sm:mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4 text-2xl">
                    <i class="fa-solid fa-tooth"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">OdontoSantos</h1>
                <p class="text-sm text-slate-500 mt-1">Entre com sua conta do Firebase</p>
            </div>
            <form onsubmit="fazerLoginFirebase(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Senha</label>
                    <input type="password" id="login-senha" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm hidden">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-lg flex items-center justify-center text-lg">
                    <i class="fa-solid fa-tooth"></i>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900 leading-tight">OdontoSantos</h2>
                    <span id="header-user-badge" class="inline-block px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-700 rounded-full mt-0.5">Perfil: Carregando...</span>
                </div>
            </div>
            <button onclick="logout()" class="text-sm text-slate-600 hover:text-red-600 font-medium flex items-center space-x-1 p-2">
                <i class="fa-solid fa-right-from-bracket text-lg"></i><span class="hidden sm:inline">Sair</span>
            </button>
        </div>
    </header>

    <!-- NAVEGAÇÃO -->
    <nav id="main-nav" class="bg-slate-900 text-white shadow-inner hidden">
        <div class="max-w-7xl mx-auto px-2 flex space-x-1 overflow-x-auto scrollbar-none" id="nav-tabs"></div>
    </nav>

    <!-- CONTEÚDO -->
    <main id="main-content" class="flex-grow max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-4 hidden relative">

        <!-- ABA 1: AGENDA -->
        <section id="tab-agenda" class="tab-content space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="busca-agenda-input" oninput="filtrarAgendaRapida()" placeholder="Pesquisar na agenda..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="abrirModalLembrete()" class="flex-1 sm:flex-none px-3 py-2 bg-slate-700 text-white text-sm font-semibold rounded-lg flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-thumbtack"></i> Bloqueio
                    </button>
                    <button onclick="abrirModalAgendamento()" class="flex-1 sm:flex-none px-3 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> Agendar
                    </button>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-2 sm:p-4">
                <div id="calendar" class="min-h-[60vh]"></div>
            </div>

            <!-- FAB MOBILE -->
            <button onclick="abrirModalAgendamento()" id="fab-agenda-mobile" class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl z-40 sm:hidden active:scale-95 transition-transform hidden">
                <i class="fa-solid fa-plus"></i>
            </button>
        </section>

        <!-- ABA 2: PACIENTES -->
        <section id="tab-pacientes" class="tab-content hidden space-y-4">
            <div class="flex flex-col md:flex-row gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <input type="text" id="busca-pacientes-tabela" oninput="renderizarPacientes()" placeholder="Buscar paciente..." class="flex-grow px-4 py-2 border rounded-lg text-sm bg-slate-50">
                <select id="filtro-categoria-pacientes" onchange="renderizarPacientes()" class="px-3 py-2 border rounded-lg text-sm bg-slate-50">
                    <option value="todos">Todos</option><option value="clinico">Clínico</option><option value="orto">Ortodontia</option>
                </select>
                <button onclick="abrirModalPaciente()" class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Novo Paciente
                </button>
            </div>
            <div class="bg-transparent sm:bg-white rounded-xl sm:shadow-sm sm:border sm:border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse tabela-responsiva">
                    <thead class="bg-slate-100 text-slate-600 text-xs uppercase hidden sm:table-header-group">
                        <tr><th class="p-4">Nome</th><th class="p-4">Telefone</th><th class="p-4">Categoria</th><th class="p-4">Vencimento Orto</th><th class="p-4 text-right">Ações</th></tr>
                    </thead>
                    <tbody id="tabela-pacientes-body" class="text-sm space-y-2 sm:space-y-0 sm:divide-y sm:divide-slate-100 block sm:table-row-group"></tbody>
                </table>
            </div>
        </section>

        <!-- ABA 3: FINANCEIRO -->
        <section id="tab-financeiro" class="tab-content hidden space-y-4">
            <div class="flex flex-col sm:flex-row gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <select id="filtro-periodo-financeiro" onchange="renderizarFinanceiro()" class="px-3 py-2 border rounded-lg text-sm bg-slate-50 flex-grow">
                    <option value="mes">Mês Atual</option><option value="hoje">Hoje</option><option value="todos">Todo Histórico</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="fecharCaixaDiario()" class="flex-1 px-4 py-2 bg-slate-800 text-white text-sm font-semibold rounded-lg">Caixa</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                    <h4 class="font-bold text-slate-800 border-b pb-2 mb-3">Pendências</h4>
                    <div id="lista-pendencias-financeiras" class="space-y-2"></div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                    <h4 class="font-bold text-slate-800 border-b pb-2 mb-3">Movimentações</h4>
                    <div id="lista-pagamentos-realizados" class="space-y-2"></div>
                </div>
            </div>
        </section>

        <!-- ABA 4: DETALHES -->
        <section id="tab-detalhes-paciente" class="tab-content hidden space-y-4">
            <button onclick="voltarParaOrigem()" class="px-4 py-2 bg-slate-200 text-slate-800 font-bold rounded-lg mb-2"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
            <div id="detalhes-paciente-container"></div>
        </section>

    </main>

    <!-- MODAL DETALHES EVENTO -->
    <div id="modal-detalhes-agendamento" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-lg font-bold">Detalhes</h3>
                <button onclick="fecharModal('modal-detalhes-agendamento')" class="p-2 text-2xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-sm">
                <div class="bg-slate-50 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 uppercase">Título/Paciente</p>
                    <h4 id="detalhe-ag-paciente" class="text-base font-bold">---</h4>
                </div>
                <div class="bg-slate-50 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 uppercase">Data e Hora</p>
                    <p id="detalhe-ag-datahora" class="font-semibold">---</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 uppercase">Observações</p>
                    <p id="detalhe-ag-obs">---</p>
                </div>
            </div>
            <div id="container-status-agendamento"></div>
            <div class="grid grid-cols-2 gap-2 pt-3 border-t">
                <button id="btn-excluir-ag-modal" class="py-3 bg-rose-100 text-rose-700 font-bold rounded-lg"><i class="fa-solid fa-trash"></i> Excluir</button>
                <button id="btn-editar-ag-modal" class="py-3 bg-amber-100 text-amber-800 font-bold rounded-lg"><i class="fa-solid fa-pen"></i> Editar</button>
            </div>
            <button id="btn-ver-ficha-ag-modal" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg mt-2 hidden"><i class="fa-solid fa-user"></i> Ver Ficha</button>
        </div>
    </div>

    <!-- MODAL AGENDAMENTO E LEMBRETE (Simplificados por espaço, mantêm a estrutura) -->
    <div id="modal-agendamento" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto">
            <h3 id="titulo-modal-agendamento" class="font-bold text-lg mb-4">Novo Agendamento</h3>
            <form onsubmit="salvarAgendamento(event)" class="space-y-3">
                <input type="hidden" id="agendamento-edit-id">
                <select id="agendamento-paciente" class="w-full p-3 border rounded-lg"></select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="agendamento-data" required class="w-full p-3 border rounded-lg">
                    <input type="time" id="agendamento-horario" onchange="atualizarHoraFimPadrao()" required class="w-full p-3 border rounded-lg">
                    <input type="time" id="agendamento-hora-fim" required class="w-full p-3 border rounded-lg col-span-2">
                </div>
                <select id="agendamento-tipo" class="w-full p-3 border rounded-lg"><option value="Procedimento">Procedimento</option><option value="Retorno">Retorno</option></select>
                <textarea id="agendamento-obs" class="w-full p-3 border rounded-lg" placeholder="Obs"></textarea>
                <div class="flex gap-2">
                    <button type="button" onclick="fecharModal('modal-agendamento')" class="flex-1 py-3 bg-slate-200 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-lg font-bold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-lembrete" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto">
            <h3 id="titulo-modal-lembrete" class="font-bold text-lg mb-4">Novo Lembrete</h3>
            <form onsubmit="salvarLembrete(event)" class="space-y-3">
                <input type="hidden" id="lembrete-edit-id">
                <input type="text" id="lembrete-titulo" required placeholder="Título" class="w-full p-3 border rounded-lg">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="lembrete-data" required class="w-full p-3 border rounded-lg">
                    <input type="time" id="lembrete-horario" required class="w-full p-3 border rounded-lg">
                    <input type="time" id="lembrete-hora-fim" required class="w-full p-3 border rounded-lg col-span-2">
                </div>
                <textarea id="lembrete-obs" class="w-full p-3 border rounded-lg" placeholder="Obs"></textarea>
                <div class="flex gap-2">
                    <button type="button" onclick="fecharModal('modal-lembrete')" class="flex-1 py-3 bg-slate-200 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="flex-1 py-3 bg-slate-800 text-white rounded-lg font-bold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PACIENTE -->
    <div id="modal-paciente" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg mb-4">Paciente</h3>
            <form id="form-paciente" onsubmit="salvarPaciente(event)" class="space-y-3">
                <input type="hidden" id="paciente-edit-id">
                <input type="text" id="paciente-nome" required placeholder="Nome Completo" class="w-full p-3 border rounded-lg uppercase">
                <input type="text" id="paciente-telefone" placeholder="Telefone" class="w-full p-3 border rounded-lg">
                <select id="paciente-categoria" class="w-full p-3 border rounded-lg"><option value="Clínico">Clínico</option><option value="Ortodontia">Ortodontia</option></select>
                <div class="flex gap-2">
                    <button type="button" onclick="fecharModal('modal-paciente')" class="flex-1 py-3 bg-slate-200 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-lg font-bold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
